<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>調号トレーナー — M2.1 prototype</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main class="app-shell">
  <header class="app-header"><div><p class="eyebrow">M2.1 prototype</p><h1>調号トレーナー</h1></div><p id="session-timer" class="timer" aria-label="経過時間">00:00</p></header>
  <section id="start-screen" class="panel hero" aria-labelledby="start-heading">
    <div class="hero-mark" aria-hidden="true">♭ ♮ ♯</div><h2 id="start-heading">調号と調名を結びつける</h2>
    <div class="settings">
      <label for="practice-mode">進め方</label><select id="practice-mode"><option value="practice">Practice — 1問ずつ確認</option><option value="exam">Exam — 最後にまとめて確認</option></select>
      <label for="display-mode">調名表記</label><select id="display-mode"></select>
    </div>
    <button id="start-button" class="primary-button" type="button">始める</button><p class="prototype-note">UI確認用の出題範囲: 調号なし・シャープ1個・フラット1個</p>
  </section>
  <section id="quiz-screen" class="panel hidden" aria-labelledby="question-title">
    <div class="progress-row"><span id="progress-text">問題 1</span><span id="retry-badge" class="badge hidden">再挑戦</span></div>
    <h2 id="question-title" tabindex="-1"></h2><p class="sr-only">選択後に回答ボタンを押してください。</p>
    <div class="notation-card"><div id="notation-preview" class="notation-preview"></div><p id="notation-label"></p></div>
    <div id="key-answer-area" class="answer-area hidden"><div id="key-options" class="key-grid" role="group" aria-label="調名の選択肢。配置はすべての問題で固定です"></div><button id="key-commit" class="primary-button" type="button" disabled>回答する</button></div>
    <div id="signature-answer-area" class="answer-area hidden"><div class="signature-selector" role="group" aria-label="調号を選ぶ"><button id="signature-down" class="selector-button" type="button" aria-label="フラット方向へ1つ移動">← ♭</button><button id="signature-up" class="selector-button" type="button" aria-label="シャープ方向へ1つ移動">♯ →</button></div><p id="signature-status" class="sr-only" aria-live="polite"></p><button id="signature-commit" class="primary-button" type="button">回答する</button></div>
    <div id="feedback" class="feedback hidden" role="status" aria-live="polite"><p id="feedback-heading" class="feedback-heading"></p><p id="feedback-detail"></p><p id="feedback-context" class="feedback-context"></p><button id="next-button" class="primary-button" type="button">次へ</button></div>
  </section>
  <section id="result-screen" class="panel hidden" aria-labelledby="result-heading">
    <p class="eyebrow">Session complete</p><h2 id="result-heading" tabindex="-1">今回の結果</h2><div id="result-metrics" class="metrics"></div>
    <ol id="exam-review" class="exam-review hidden" aria-label="Examの回答比較"></ol>
    <h3>特徴を見る</h3><ul id="observations" class="observations"></ul>
    <h3>AIに相談</h3><p>記録は自動送信されません。必要なら文章をコピーしてください。</p><button id="copy-ai" class="secondary-button" type="button">AI相談文をコピー</button><textarea id="ai-text" class="export-text" readonly aria-label="AI相談文"></textarea>
    <h3>データ</h3><div class="button-row"><button id="copy-json" class="secondary-button" type="button">JSONをコピー</button><button id="download-json" class="secondary-button" type="button">JSONを保存</button></div><textarea id="json-text" class="export-text" readonly aria-label="セッションJSON"></textarea><p id="copy-status" class="copy-status" role="status"></p><button id="restart-button" class="primary-button" type="button">設定に戻る</button>
  </section>
</main><div id="copy-toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="src/app.js"></script>
</body></html>
