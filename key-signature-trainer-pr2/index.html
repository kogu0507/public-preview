<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>調号トレーナー — M2 prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">M2 prototype</p>
        <h1>調号トレーナー</h1>
      </div>
      <p id="session-timer" class="timer" aria-live="off">00:00</p>
    </header>

    <section id="start-screen" class="panel hero" aria-labelledby="start-heading">
      <div class="hero-mark" aria-hidden="true">♭ ♮ ♯</div>
      <h2 id="start-heading">4つの出題形式を練習</h2>
      <p>調号を見て調名を答える問題と、調名から調号を選ぶ問題に取り組みます。不正解の問題は最後にもう一度出題されます。</p>
      <button id="start-button" class="primary-button" type="button">練習を始める</button>
      <p class="prototype-note">試作範囲: 調号なし・シャープ1個・フラット1個</p>
    </section>

    <section id="quiz-screen" class="panel hidden" aria-labelledby="question-title">
      <div class="progress-row">
        <span id="progress-text">問題 1</span>
        <span id="retry-badge" class="badge hidden">再挑戦</span>
      </div>
      <h2 id="question-title" tabindex="-1"></h2>
      <p id="question-prompt" class="question-prompt"></p>

      <div id="notation-card" class="notation-card">
        <img id="notation-preview" src="assets/key-signatures/natural-0.svg" alt="調号なしのト音記号譜表">
        <p id="notation-label">調号なし（0）</p>
      </div>

      <div id="key-answer-area" class="answer-area hidden">
        <div id="key-options" class="key-grid" role="group" aria-label="調名の選択肢"></div>
        <button id="key-commit" class="primary-button" type="button" disabled>回答する</button>
      </div>

      <div id="signature-answer-area" class="answer-area hidden">
        <div class="signature-selector" role="group" aria-label="調号を選ぶ">
          <button id="signature-down" class="selector-button" type="button" aria-label="フラット方向へ1つ移動">← ♭</button>
          <output id="signature-value" aria-live="polite">0</output>
          <button id="signature-up" class="selector-button" type="button" aria-label="シャープ方向へ1つ移動">♯ →</button>
        </div>
        <button id="signature-commit" class="primary-button" type="button">回答する</button>
      </div>

      <div id="feedback" class="feedback hidden" role="status" aria-live="polite">
        <p id="feedback-heading" class="feedback-heading"></p>
        <p id="feedback-detail"></p>
        <button id="next-button" class="primary-button" type="button">次へ</button>
      </div>
    </section>

    <section id="result-screen" class="panel hidden" aria-labelledby="result-heading">
      <p class="eyebrow">Session complete</p>
      <h2 id="result-heading" tabindex="-1">今回の結果</h2>
      <div id="result-metrics" class="metrics"></div>

      <h3>特徴を見る</h3>
      <ul id="observations" class="observations"></ul>

      <h3>AIに相談</h3>
      <p>記録を外部へ自動送信しません。下の文章をコピーして、任意のAIに自分で貼り付けられます。</p>
      <button id="copy-ai" class="secondary-button" type="button">AI相談文をコピー</button>
      <textarea id="ai-text" class="export-text" readonly aria-label="AI相談文"></textarea>

      <h3>データ</h3>
      <div class="button-row">
        <button id="copy-json" class="secondary-button" type="button">JSONをコピー</button>
        <button id="download-json" class="secondary-button" type="button">JSONを保存</button>
      </div>
      <textarea id="json-text" class="export-text" readonly aria-label="セッションJSON"></textarea>
      <p id="copy-status" class="copy-status" role="status"></p>
      <button id="restart-button" class="primary-button" type="button">もう一度練習する</button>
    </section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
