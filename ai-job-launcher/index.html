<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI仕事ランチャー</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:720px;margin:auto}h1{font-size:1.35rem;margin:4px 0 6px}.lead{margin:0 0 16px;color:#555}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 5px 18px rgba(0,0,0,.05)}.card.done{opacity:.52}.row{display:flex;gap:10px;align-items:flex-start}.row input{width:22px;height:22px;margin-top:2px}.meta{font-size:.86rem;color:#666;margin:.35rem 0}.desc{line-height:1.5;margin:.5rem 0 0}button{width:100%;padding:13px;border:0;border-radius:11px;background:#111;color:#fff;font:inherit;font-weight:700;margin-top:12px}.secondary{background:#e9ebef;color:#111}.status{font-size:.9rem;color:#555;min-height:1.2em;margin-top:8px}.empty{background:#fff;border:1px dashed #bbb;border-radius:14px;padding:18px;color:#555}
</style>
</head>
<body><main>
<h1>AI仕事ランチャー</h1>
<p class="lead">移動中にできるものから選んで進めます。完了チェックはこの端末に保存されます。</p>
<div id="cards"></div>
</main>
<script>
const projectUrl='https://chatgpt.com/g/g-p-6a75c4173298819193ea7d27cde06902-google-drive-projects/project';
function decodeData(){
  const m=location.hash.match(/(?:^#|&)data=([^&]+)/);
  if(!m)return null;
  try{
    let s=m[1].replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    const bin=atob(s);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const data=JSON.parse(new TextDecoder().decode(bytes));
    return Array.isArray(data)?data:null;
  }catch(e){return null}
}
function key(id){return 'ai-job-launcher:done:'+id}
async function copy(text,status){
  try{await navigator.clipboard.writeText(text);status.textContent='コピーしました。';return true}
  catch(e){status.textContent='コピーできませんでした。';return false}
}
function render(){
 const root=document.getElementById('cards');
 const tasks=decodeData();
 root.innerHTML='';
 if(!tasks){
   root.innerHTML='<div class="empty">カードデータを読み込めませんでした。Calendarのリンクからもう一度開いてください。</div>';
   return;
 }
 if(!tasks.length){
   root.innerHTML='<div class="empty">今日のタスクはありません。</div>';
   return;
 }
 tasks.forEach(t=>{
  const card=document.createElement('section');card.className='card';
  const checked=localStorage.getItem(key(t.id))==='1';if(checked)card.classList.add('done');
  card.innerHTML=`<div class="row"><input type="checkbox" ${checked?'checked':''} aria-label="完了"><div><strong></strong><div class="meta"></div><div class="desc"></div></div></div><button type="button">コピーしてGoogle Drive Projectsを開く</button><button type="button" class="secondary">プロンプトだけコピー</button><div class="status" aria-live="polite"></div>`;
  card.querySelector('strong').textContent=t.title||'AI仕事';
  card.querySelector('.meta').textContent=t.minutes?`目安 ${t.minutes}分`:'';
  card.querySelector('.desc').textContent=t.description||'';
  const box=card.querySelector('input'),buttons=card.querySelectorAll('button'),status=card.querySelector('.status');
  box.addEventListener('change',()=>{
    localStorage.setItem(key(t.id),box.checked?'1':'0');
    card.classList.toggle('done',box.checked)
  });
  buttons[1].addEventListener('click',()=>copy(t.prompt||'',status));
  buttons[0].addEventListener('click',async()=>{
    if(await copy(t.prompt||'',status))setTimeout(()=>location.href=projectUrl,160)
  });
  root.appendChild(card);
 });
}
render();
</script></body></html>
