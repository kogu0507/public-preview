<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>AI仕事ランチャー｜DUMMY 02</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f6f7f9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}
    main{width:min(680px,100%);background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
    h1{font-size:1.35rem;margin:0 0 8px}
    p{line-height:1.55}
    textarea{width:100%;min-height:260px;padding:14px;border:1px solid #bbb;border-radius:12px;font:inherit;line-height:1.5;resize:vertical;background:#fafafa}
    button,a.button{width:100%;display:block;margin-top:12px;padding:15px 16px;border:0;border-radius:12px;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
    #copyOpen{background:#111;color:#fff}
    #copyOnly{background:#e9ebef;color:#111}
    a.button{background:#e9ebef;color:#111}
    #status{min-height:1.5em;margin:12px 2px 0;font-size:.95rem;color:#444}
    .note{font-size:.9rem;color:#555}
  </style>
</head>
<body>
<main>
  <h1>AI仕事｜DUMMY 02</h1>
  <p class="note">Calendar半自動AI仕事ランチャーのAndroid実験用ページです。</p>
  <textarea id="prompt" readonly>これはCalendar半自動AI仕事ランチャーの動作確認用ダミータスクです。

新Chatとして開始し、次の作業だけ行ってください。

1. 「赤・青・黄」の3項目を、五十音順と文字数順の2通りで整理する。
2. 結果を簡単に比較する。
3. 「DUMMY TASK 02 COMPLETE」と表示して停止する。

Google Drive、Calendar、Gmail、Web、外部サービス、正本は変更しないでください。
追加作業はせず、このダミータスクだけで終了してください。</textarea>

  <button id="copyOpen" type="button">プロンプトをコピーして Google Drive Projects を開く</button>
  <button id="copyOnly" type="button">プロンプトだけコピー</button>
  <a class="button" href="https://chatgpt.com/g/g-p-6a75c4173298819193ea7d27cde06902-google-drive-projects/project">Google Drive Projectsだけ開く</a>
  <div id="status" aria-live="polite"></div>
</main>
<script>
  const promptEl = document.getElementById('prompt');
  const statusEl = document.getElementById('status');
  const projectUrl = 'https://chatgpt.com/g/g-p-6a75c4173298819193ea7d27cde06902-google-drive-projects/project';

  async function copyPrompt(){
    const text = promptEl.value;
    try {
      await navigator.clipboard.writeText(text);
      statusEl.textContent = 'コピーしました。';
      return true;
    } catch (e) {
      promptEl.focus();
      promptEl.select();
      const ok = document.execCommand('copy');
      statusEl.textContent = ok ? 'コピーしました。' : 'コピーできませんでした。長押しで本文をコピーしてください。';
      return ok;
    }
  }

  document.getElementById('copyOnly').addEventListener('click', copyPrompt);
  document.getElementById('copyOpen').addEventListener('click', async () => {
    const ok = await copyPrompt();
    if (ok) {
      setTimeout(() => { window.location.href = projectUrl; }, 180);
    }
  });
</script>
</body>
</html>
